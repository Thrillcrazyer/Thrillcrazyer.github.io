name: Get Citation Data

on: 
 workflow_dispatch:
 page_build: 
 schedule:
  - cron:  '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Requirements
      run: |
        pip install -r google_scholar_crawler/requirements.txt
    - name: Crawl and publish citation data
      run: bash google_scholar_crawler/publish_google_scholar_stats.sh
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        PYTHON_BIN: python
